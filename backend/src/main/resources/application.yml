server:
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 660000   # 11 minutes — keeps the TCP connection alive for SSE
    max-http-form-post-size: -1  # disable Tomcat's default 2MB multipart cap; Spring's multipart limits apply instead

spring:
  mvc:
    async:
      request-timeout: 660000    # 11 minutes — must exceed the SseEmitter timeout (600s)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/${DB_NAME}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── OAuth2 / Google ────────────────────────────────────


# ─── Наши настройки ───────────────────────────────────────
app:
  upload:
    dir: /app/uploads
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 часа
  vote:
    hash-pepper: ${VOTE_HASH_PEPPER}
  cors:
    allowed-origins: http://localhost:3000,https://sociolog.bg,https://www.sociolog.bg
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

# ─── Logging ──────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.survey: INFO
    org.springframework.security: WARN
