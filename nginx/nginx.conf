resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name sociolog.bg www.sociolog.bg sociolog.online www.sociolog.online;
    return 301 https://sociolog.bg$request_uri;
}

server {
    listen 443 ssl;
    server_name sociolog.online www.sociolog.online;

    ssl_certificate /etc/letsencrypt/live/sociolog.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sociolog.online/privkey.pem;

    return 301 https://sociolog.bg$request_uri;
}

server {
    listen 443 ssl;
    server_name www.sociolog.bg;

    ssl_certificate /etc/letsencrypt/live/sociolog.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sociolog.online/privkey.pem;

    return 301 https://sociolog.bg$request_uri;
}

server {
    listen 443 ssl;
    server_name sociolog.bg;

    ssl_certificate /etc/letsencrypt/live/sociolog.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sociolog.online/privkey.pem;

    # Allow only TLS 1.2 and 1.3; disable older insecure versions
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Force HTTPS for 1 year; include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 6M;

    location ^~ /uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /api/admin/upload {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6M;
    }

    location ^~ /api/contact {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Use $remote_addr instead of $proxy_add_x_forwarded_for to prevent
        # clients from spoofing their IP via a crafted X-Forwarded-For header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint — buffering must be off or chunks are held until connection closes
    location ^~ /api/admin/newsroom/generate {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;    # reset on every heartbeat chunk (sent every 15s)
        proxy_send_timeout 60s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location ^~ /api {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
